[permissions]
# mode = 无规则匹配时的默认行为:ask(询问)|allow(自动允许)|deny(拒绝)
mode = "allow"
allow = ["Bash(git remote:*)", "Bash=git config --get remote.origin.url; git status 2>&1 | Select-Object -First 3", "Bash=git remote add origin https://github.com/huruijie-steam/hottopic.git; git remote -v", "Bash=git status --short | Select-Object -First 30; git branch -a", "Bash=git add -A; git commit -m \"初始提交:HotTopic 热点话题项目\"; git branch -M main", "Bash(git push:*)", "Bash=reasonix doctor capabilities --json 2>&1 | Select-Object -First 40", "Bash=$tmp = Join-Path $env:TEMP \"yupi-hot-monitor-study\"; if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }; git clone --depth 1 https://github.com/liyupi/yupi-hot-monitor.git $tmp 2>&1 | Select-Object -Last 3; Write-Output \"==> $tmp\"", "Bash=$tmp = Join-Path $env:TEMP \"yupi-hot-monitor-study\"; Get-ChildItem $tmp -Force | Select-Object Name; Write-Output \"==== 是否 git 仓库 ====\"; git -C $tmp log --oneline -1 2>&1", "Bash=$tmp = Join-Path $env:TEMP \"yupi-hot-monitor-study\"; Get-ChildItem $tmp\\server, $tmp\\client, $tmp\\docs -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch \"node_modules|\\.git\" } | Select-Object @{N='Path';E={$_.FullName.Replace($tmp,'')}}, Length | Format-Table -AutoSize", "Bash=$tmp = Join-Path $env:TEMP \"yupi-hot-monitor-study\"; Get-ChildItem $tmp\\skills -Recurse -File | Select-Object @{N='Path';E={$_.FullName.Replace($tmp,'')}}; Write-Output \"==== server package.json ====\"; Get-Content $tmp\\server\\package.json; Write-Output \"==== client package.json ====\"; Get-Content $tmp\\client\\package.json", "explore"]
