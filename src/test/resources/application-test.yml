# 测试环境配置:内存数据库 + 测试 AI key,执行 H2 版建表 SQL
spring:
  datasource:
    url: jdbc:h2:mem:hottopic;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  ai:
    deepseek:
      api-key: test-key
